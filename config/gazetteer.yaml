# Names used by the rule extractor (src/vmap/extract/rules.py) to spot place mentions.
# Municipality and province names come from the IGN files (data/raw/lineas_limite) and
# config/place_aliases.yaml; this file only adds what those files do not have.
# Detection only: nothing here assigns a clip to a place. Resolution and checks happen in Phase 5.

# INE province code → extra names (the IGN name and its "/" variants are always included)
province_aliases:
  "01": [Álava, Araba]
  "03": [Alicante, Alacant]
  "07": [Baleares, Islas Baleares, Balearic Islands]
  "12": [Castellón, Castelló]
  "15": [La Coruña]
  "17": [Gerona]
  "20": [Guipúzcoa]
  "25": [Lérida]
  "31": [Nafarroa]
  "32": [Orense]
  "33": [Principado de Asturias]
  "41": [Seville]
  "46": [Valencia, València]
  "48": [Vizcaya, Biscay]

# Extra names for autonomous communities (IGN community names are always included)
region_aliases:
  "01": [Andalusia]
  "04": [Islas Baleares, Balearic Islands]
  "05": [Canarias, Islas Canarias, Canary Islands]
  "07": [Castile and León, Castilla León]
  "08": [Castilla La Mancha, Castile-La Mancha]
  "09": [Cataluña, Catalunya, Catalonia]
  "10": [Comunidad Valenciana, Valencian Community]
  "15": [Navarre]
  "16": [País Vasco, Euskadi, Basque Country]

# Islands → unit id
islands:
