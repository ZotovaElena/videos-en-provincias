# Names that, alone, are also well-known places outside Spain. Matched, but flagged as ambiguous
# unless the passage also mentions Spain, the place's province/community, or another Spanish place.
foreign_homonyms:
  [Santiago, Córdoba, Valencia, Mérida, Toledo, Granada, Guadalajara, León, Cartagena, Trujillo, Medellín,
   Salamanca, Laredo, Durango, Guernica, Cuenca, Santa Cruz, San Juan, Victoria, La Palma, Santa Marta,
   San Pedro, Santa Fe, Valladolid, Zamora, Lugo, Palencia, Segovia, Talavera, Aranjuez, Alicante]

