  07-MEN: [Menorca, Minorca]
  07-IBI: [Ibiza, Eivissa]
  07-FOR: [Formentera]
  35-GCA: [Gran Canaria]
  35-LAN: [Lanzarote]
  35-FUE: [Fuerteventura]
  35-GRA: [La Graciosa]
  38-TFE: [Tenerife]
  38-LPA: [La Palma]
  38-GOM: [La Gomera]
  38-HIE: [El Hierro]

# Extra municipality names in English/other forms (INE code → names)
municipality_aliases:
  "41091": [Seville]
  "50297": [Saragossa]
  "48020": [Bilbo]
  "11020": [Jerez]

